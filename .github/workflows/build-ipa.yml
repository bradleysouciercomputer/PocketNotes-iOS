name: Build Pocket Notes IPA

"on":
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketNotes.xcodeproj \
            -scheme PocketNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/PocketNotes.app"
          test -d "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/PocketNotes.app"
          cd "$GITHUB_WORKSPACE/build"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/PocketNotes.ipa"
          test -s "$GITHUB_WORKSPACE/PocketNotes.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketNotes-IPA
          path: PocketNotes.ipa
          if-no-files-found: error
          retention-days: 14
